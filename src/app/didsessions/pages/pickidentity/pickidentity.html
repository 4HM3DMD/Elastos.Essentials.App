<ion-content>
  <app-titlebar></app-titlebar>
  <ion-grid class="container" [class.blur]="uxService.popover">
    <div class="identities">
      <div *ngFor="let group of groupedIdentities">
        <div class="id-row ion-activatable" *ngFor="let identityEntry of group.entries">
          <div class="avatar-wrap" (click)="signIn(identityEntry)">
            <div *ngIf="!identityEntry.avatar" class="avatar noAvatar"
              inlineSVG="assets/launcher/default/default-avatar.svg"></div>
            <img *ngIf="identityEntry.avatar" class="avatar"
              [src]="'data:'+identityEntry.avatar.contentType+';base64,'+identityEntry.avatar.base64ImageData">
          </div>

          <div class="meta" (click)="signIn(identityEntry)">
            <span class="name">{{ identityEntry.name }}</span>
            <span class="did">{{ identityEntry.didString.slice(0,16) }}...{{ identityEntry.didString.slice(40,46) }}</span>
          </div>

          <span class="row-action" role="button" aria-label="Identity options"
            (click)="showOptions($event, identityEntry)">
            <ion-icon name="ellipsis-horizontal"></ion-icon>
          </span>

          <ion-ripple-effect></ion-ripple-effect>
        </div>
      </div>
    </div>

    <div *ngIf="!uxService.popover" class="footer">
      <ebutton (clicked)="createIdentity()" [title]="'didsessions.create-new-identity' | translate"></ebutton>
    </div>

  </ion-grid>
</ion-content>
