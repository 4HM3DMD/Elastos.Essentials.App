<ion-content>
  <app-titlebar></app-titlebar>
  <div class="name-identity" [class.dark-container]="theme.darkMode">
    <h1 class="heading">{{ 'didsessions.your-name' | translate }}</h1>

    <ion-input class="name-input" [placeholder]="'didsessions.enter-name-here' | translate" #input
      [(ngModel)]="name" name="name" ngDefaultControl></ion-input>

    <div class="footer">
      <ebutton [arrow]="true" [disabled]="creatingDid || !name?.trim()" (clicked)="next()"
        [title]="'common.continue' | translate"></ebutton>
    </div>
  </div>
</ion-content>
