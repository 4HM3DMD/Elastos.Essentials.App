<ion-content>
  <app-titlebar></app-titlebar>

  <div class="settings">
    <div class="intro">
      <h1 class="heading">{{ 'didsessions.settings-heading' | translate }}</h1>
      <p class="subtitle">{{ 'didsessions.settings-subtitle' | translate }}</p>
    </div>

    <div class="rows">
      <!-- Language selection -->
      <button type="button" class="row" (click)="open('/didsessions/language')">
        <span class="row-glyph">
          <ion-icon name="language-outline"></ion-icon>
        </span>
        <span class="row-text">
          <span class="row-title">{{ 'common.language-setting' | translate }}</span>
          <span class="row-sub">{{ 'settings.change-lang' | translate }}</span>
        </span>
        <ion-icon class="chevron" name="chevron-forward"></ion-icon>
      </button>

      <!-- Network configuration -->
      <button type="button" class="row" (click)="open('/didsessions/settings-select-net')">
        <span class="row-glyph">
          <ion-icon name="globe-outline"></ion-icon>
        </span>
        <span class="row-text">
          <span class="row-title">{{ 'settings.configure-network' | translate }}</span>
          <span class="row-sub">{{ 'settings.developer-setting' | translate }}</span>
        </span>
        <ion-icon class="chevron" name="chevron-forward"></ion-icon>
      </button>
    </div>
  </div>
</ion-content>
