<ion-content>
  <app-titlebar></app-titlebar>
  <div class="container">

    <div class="intro">
      <h1>{{ 'didsessions.more-than-one-import-did-pick-one' | translate }}</h1>
    </div>

    <div class="did-list">
      <button type="button" class="did-card ion-activatable" *ngFor="let did of importedDids"
        [class.selected]="selectedDid === did" (click)="selectDID(did)">
        <span class="avatar" aria-hidden="true">
          <ion-icon name="person-circle-outline"></ion-icon>
        </span>
        <span class="meta">
          <span class="name">{{ did.getNameCredentialValue() }}</span>
          <span class="sub">{{ did.getDIDString() }}</span>
        </span>
        <ion-icon class="check" name="checkmark"></ion-icon>
        <ion-ripple-effect></ion-ripple-effect>
      </button>
    </div>

    <div class="footer" *ngIf="selectedDid">
      <ebutton (clicked)="continue()" [title]="'common.continue' | translate "></ebutton>
    </div>

  </div>
</ion-content>
