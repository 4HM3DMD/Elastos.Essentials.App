<ion-content>
  <app-titlebar></app-titlebar>
  <div class="language-select">
    <div class="content-top">
      <div class="hero">
        <div class="glyph">
          <ion-icon name="globe-outline"></ion-icon>
        </div>
        <h1 class="heading">{{ 'common.language-setting' | translate }}</h1>
        <p class="subtitle">{{ 'didsessions.language-subtitle' | translate }}</p>
      </div>

      <div class="list">
        <button type="button" class="lang-row" *ngFor="let language of languageService.languages"
          [class.selected]="languageService.selectedLanguage === language.code"
          (click)="languageService.setSelectedLanguage(language.code)">
          <span class="lang-name">{{ language.name }}</span>
          <ion-icon class="check" name="checkmark"
            *ngIf="languageService.selectedLanguage === language.code"></ion-icon>
        </button>
      </div>
    </div>

    <div class="footer">
      <ebutton [arrow]="true" [disabled]="!languageService.selectedLanguage" (clicked)="continue()"
        [title]="'common.confirm' | translate"></ebutton>
    </div>
  </div>
</ion-content>
