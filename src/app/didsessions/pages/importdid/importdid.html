<ion-content id='rootcontent'>
  <app-titlebar></app-titlebar>
  <div class="container" [class.blur]="loadingIdentity">

    <p class="prompt">{{ 'didsessions.import-prompt' | translate }}</p>

    <div class="mnemonic-grid" (click)="startMnemonicInput()">
      <ion-row class="mnemonic-row" *ngFor="let i of [1,4,7,10]">
        <ion-col size="4" class="word-chip" [class.selectedCol]="isWord(mnemonicWords[i - 1])">
          <span class="mnemonic-index">{{ i }}</span>
          <ion-label class="word-text">{{ mnemonicWords[i - 1] }}</ion-label>
        </ion-col>
        <ion-col size="4" class="word-chip" [class.selectedCol]="isWord(mnemonicWords[i])">
          <span class="mnemonic-index">{{ i + 1 }}</span>
          <ion-label class="word-text">{{ mnemonicWords[i] }}</ion-label>
        </ion-col>
        <ion-col size="4" class="word-chip" [class.selectedCol]="isWord(mnemonicWords[i + 1])">
          <span class="mnemonic-index">{{ i + 2 }}</span>
          <ion-label class="word-text">{{ mnemonicWords[i + 1] }}</ion-label>
        </ion-col>
      </ion-row>
    </div>

    <ion-row *ngIf="inputMnemonicCompleted()" class="btn-row">
      <ebutton (clicked)="promptStorePassword()" [title]="'common.continue' | translate"> </ebutton>
    </ion-row>

  </div>

</ion-content>
