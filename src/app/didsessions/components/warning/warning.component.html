<div class="container" [class.darkContainer]="theme.darkMode">

  <div class="glyph">
    <ion-icon name="warning-outline"></ion-icon>
  </div>

  <h1>{{ 'didsessions.delete-identity' | translate }}</h1>
  <p>{{ 'didsessions.delete-identity-prompt' | translate }}</p>

  <div class="btn-row">
    <button type="button" class="btn cancel ion-activatable" (click)="cancel()">
      <ion-label>{{ 'common.cancel' | translate }}</ion-label>
      <ion-ripple-effect></ion-ripple-effect>
    </button>
    <button type="button" class="btn danger ion-activatable" (click)="deleteDID()">
      <ion-label>{{ 'common.delete' | translate }}</ion-label>
      <ion-ripple-effect></ion-ripple-effect>
    </button>
  </div>

</div>
