<ion-content class="content">
  <app-titlebar></app-titlebar>

  <div class="profile-page">

    <!-- Identity hero: avatar + name + quick actions + bio -->
    <div class="identity-hero">
      <div class="avatar-disc">
        <ion-icon *ngIf="!avatarDataUrl" mode="ios" name="person"></ion-icon>
        <img *ngIf="avatarDataUrl" [src]="avatarDataUrl" />
      </div>

      <div class="hero-head">
        <h1 class="hero-name" *ngIf="profile">{{ profile.getName() }}</h1>

        <div class="hero-actions">
          <button class="icon-btn ripple ion-activatable" (click)="showQRCode()">
            <ion-icon name="qr-code-outline"></ion-icon>
            <ion-ripple-effect></ion-ripple-effect>
          </button>
          <button class="icon-btn ripple ion-activatable" (click)="profileService.shareIdentity()">
            <ion-icon name="share-social-outline"></ion-icon>
            <ion-ripple-effect></ion-ripple-effect>
          </button>
        </div>
      </div>

      <p class="hero-bio" *ngIf="profile">{{ profile.getDescription() }}</p>
    </div>

    <!-- Hive storage vault card -->
    <div class="vault-card">
      <div class="vault-icon">
        <img class="baloon" src="/assets/identity/svg/hive-ballon.svg" />
        <img class="icon" src="/assets/identity/svg/hive.svg" />
      </div>
      <div class="vault-meta">
        <div class="vault-title">{{ 'identity.hive-storage-vault' | translate }}</div>
        <div *ngIf="!profileService.publishedDIDDocument || hiveIsloaded" class="vault-sub">
          {{ hiveVault ? hiveVault.getEndpoint() : 'identity.not-set' | translate }}</div>
        <div class="vault-loading" *ngIf="profileService.publishedDIDDocument && !hiveIsloaded">
          <img src="/assets/identity/svg/loader.gif">
        </div>
      </div>
    </div>

    <!-- Profile fields / credentials -->
    <div class="section-head">
      <span class="section-title">{{ 'identity.about-me' | translate }}</span>
      <button class="edit-link" (click)="profileService.editProfile();">
        <span>{{ 'identity.edit' | translate }}</span>
        <ion-icon name="chevron-forward"></ion-icon>
      </button>
    </div>

    <div class="field-list" *ngIf="this.profileService.profileEntries.length > 0">
      <div class="field-row" *ngFor="let entry of this.profileService.profileEntries">
        <div class="field-icon">
          <img [src]="getCredIconSrc(entry)">
        </div>
        <div class="field-meta">
          <span class="field-value">{{ getCredentialValue(entry.credential) | translate }}</span>
        </div>
      </div>
    </div>

  </div>
</ion-content>
