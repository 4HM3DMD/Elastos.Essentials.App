<ion-content>
  <app-titlebar></app-titlebar>
  <div class="container">
    <div class="content">
      <div class="hero">
        <h1 class="heading">{{ 'didsessions.verify-mnemonic-heading' | translate }}</h1>
        <p class="subtitle">{{ 'didsessions.verify-prompt' | translate }}</p>
      </div>

      <ion-row class="mnemonic-row">
        <ion-col size="3.6" *ngFor="let selected of selectedList" [class.selectedCol]="isWord(selected)"
          (click)="removeWord(selected, selectedList.indexOf(selected))">
          <div class="mnemonic-index">{{ selectedList.indexOf(selected) + 1 }}</div>
          <ion-label>{{ selected }}</ion-label>
        </ion-col>
      </ion-row>

      <ion-row class="mnemonic-row2" *ngIf="!allWordsSelected">
        <ion-col size="3.8" *ngFor="let mnemonic of mnemonicList"
          (click)="addWord(mnemonicList.indexOf(mnemonic), mnemonic)" [class.selectedCol]="mnemonic.selected">
          <ion-label>{{ mnemonic.text }}</ion-label>
        </ion-col>
      </ion-row>
    </div>

    <div class="footer">
      <ebutton [arrow]="true" [disabled]="!allWordsSelected" (clicked)="nextClicked()"
        [title]="'common.continue' | translate"> </ebutton>
    </div>
  </div>
</ion-content>
