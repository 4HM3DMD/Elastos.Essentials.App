<ion-content>
  <app-titlebar></app-titlebar>
  <div class="advanced-settings">
    <p class="section-label">{{ 'identity.available-options' | translate }}</p>

    <div class="option-row ion-activatable ripple" (click)="startSync()">
      <div class="icon-circle">
        <ion-icon name="refresh"></ion-icon>
      </div>
      <div class="meta">
        <span class="title">{{ 'identity.sync-did-profile' | translate }}</span>
      </div>
      <ion-icon class="chevron" name="chevron-forward"></ion-icon>
      <ion-ripple-effect></ion-ripple-effect>
    </div>
  </div>
</ion-content>
