<ion-content>
  <app-titlebar></app-titlebar>
  <div class="signrequest" *ngIf="receivedIntent">

    <!-- App / origin header -->
    <div class="req-hero">
      <div class="app-disc">
        <requesting-app [caller]="receivedIntent.params.caller"></requesting-app>
      </div>
      <p class="req-label">{{ 'identity.credimport-intro' | translate }}</p>
      <h1 class="req-title">{{ 'identity.sign-data' | translate }}</h1>
    </div>

    <!-- Intro message -->
    <div class="intro-card">
      <p>{{ 'identity.credimport-intro2' | translate }}</p>
    </div>

    <!-- Data being signed -->
    <div class="data-card">
      <p class="data-value">{{ receivedIntent.params.data }}</p>
    </div>

    <!-- Actions -->
    <div class="actions">
      <ebutton (clicked)="acceptRequest()" [title]="'identity.accept' | translate"></ebutton>
    </div>

  </div>
</ion-content>
