<ion-content>
  <app-titlebar></app-titlebar>
  <div class="signrequest" *ngIf="receivedIntent">

    <!-- Top-anchored content: hero + intro + data, growing to fill the space above the actions -->
    <div class="content-top">
      <!-- App / origin header -->
      <div class="req-hero">
        <div class="app-disc">
          <requesting-app [caller]="receivedIntent.params.caller"></requesting-app>
        </div>
        <p class="req-label">{{ 'identity.sign-request-label' | translate }}</p>
        <h1 class="req-title">{{ 'identity.sign-data' | translate }}</h1>
      </div>

      <!-- Intro message -->
      <div class="intro-card">
        <p>{{ 'identity.sign-request-desc' | translate }}</p>
      </div>

      <!-- Data being signed -->
      <div class="data-card">
        <p class="data-value">{{ receivedIntent.params.data }}</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <ebutton (clicked)="acceptRequest()" [title]="'identity.accept' | translate"></ebutton>
      <button type="button" class="reject-link" (click)="rejectRequest()">{{ 'identity.reject' | translate }}</button>
    </div>

  </div>
</ion-content>
