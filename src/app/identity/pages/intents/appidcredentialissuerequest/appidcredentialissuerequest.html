<ion-content>
  <app-titlebar></app-titlebar>

  <div *ngIf="preliminaryChecksCompleted" class="appid-request">
    <!-- Hero + details + confirmation, vertically centred so there is no dead void -->
    <div class="content-top">
      <!-- App / origin header: the requesting app's icon + name -->
      <div class="app-header">
        <div class="app-disc">
          <ion-img [src]="getAppIcon()"></ion-img>
        </div>
        <p class="app-name">{{publishedAppInfo.name}}</p>
      </div>

      <!-- Requested application details: makes "the above information" real -->
      <div class="details-card">
        <div class="detail-row">
          <span class="detail-label">{{ 'identity.app-did' | translate }}</span>
          <span class="detail-value">{{ displayableCredential.appdid }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">{{ 'identity.expire' | translate }}</span>
          <span class="detail-value">{{ displayableCredential.expirationDate.toLocaleDateString() }}</span>
        </div>
      </div>

      <!-- Request detail: what the app is asking for -->
      <div class="request-card">
        <div class="request-icon">
          <ion-icon name="finger-print-outline"></ion-icon>
        </div>
        <p class="request-msg">{{ 'identity.appidcredissue-intro' | translate }}</p>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-grid>
    <ion-row class="btn-container" *ngIf="triedToFetchAppIcon">
      <ebutton (clicked)="acceptRequest()" [title]="'identity.accept' | translate"> </ebutton>
      <button type="button" class="deny-link" (click)="rejectRequest(); titleBar.globalNav.exitCurrentContext()">{{ 'identity.appidcredissue-deny' | translate }}</button>
    </ion-row>
    <ion-spinner *ngIf="!triedToFetchAppIcon"></ion-spinner>
  </ion-grid>
</ion-footer>
