<div class="reminder">
  <div class="badge">
    <img src="/assets/launcher/apps/app-icons/identity-badge.svg" alt="" />
  </div>

  <h2 class="title">{{ title }}</h2>
  <p class="message">{{ message }}</p>

  <button type="button" class="btn primary" (click)="onBackup()">
    {{ 'launcher.backup-reminder-backup' | translate }}
  </button>

  <button type="button" class="btn ghost" [class.locked]="skipLocked" [disabled]="skipLocked" (click)="onSkip()">
    <span *ngIf="skipLocked">{{ 'launcher.backup-reminder-skip-in' | translate:{ seconds: secondsLeft } }}</span>
    <span *ngIf="!skipLocked">{{ 'launcher.backup-reminder-skip' | translate }}</span>
  </button>
</div>
