<nav class="tab-bar" role="tablist">
  <button type="button" class="tab" role="tab" [class.active]="active === 'home'" aria-label="Home"
    (click)="onHome()">
    <ion-icon src="assets/components/tab-bar/tab-home.svg"></ion-icon>
    <span class="label">{{ 'launcher.tabbar-home' | translate }}</span>
  </button>

  <button type="button" class="tab" role="tab" [class.active]="active === 'wallet'" aria-label="Wallet"
    (click)="onWallet()">
    <ion-icon src="assets/components/tab-bar/tab-wallet.svg"></ion-icon>
    <span class="label">{{ 'launcher.tabbar-wallet' | translate }}</span>
  </button>

  <button type="button" class="tab center" role="tab" [class.active]="active === 'elastos'" aria-label="Elastos"
    (click)="onElastos()">
    <div class="center-circle">
      <!-- Official 2025 Elastos brand icon (two-tone, self-coloured). -->
      <img src="assets/components/tab-bar/elastos-icon.svg" alt="Elastos" />
    </div>
  </button>

  <button type="button" class="tab" role="tab" [class.active]="active === 'browser'" aria-label="dApps"
    (click)="onBrowser()">
    <ion-icon name="apps"></ion-icon>
    <span class="label">{{ 'launcher.tabbar-dapps' | translate }}</span>
  </button>

  <button type="button" class="tab" role="tab" [class.active]="active === 'menu'" aria-label="Settings"
    (click)="onMenu()">
    <ion-icon name="settings"></ion-icon>
    <span class="label">{{ 'launcher.tabbar-settings' | translate }}</span>
  </button>
</nav>
