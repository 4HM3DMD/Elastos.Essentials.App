<nav class="tab-bar" role="tablist">
  <button type="button" class="tab" role="tab" [class.active]="active === 'home'" aria-label="Home"
    (click)="onHome()">
    <ion-icon [name]="active === 'home' ? 'home' : 'home-outline'"></ion-icon>
    <span class="label">Home</span>
  </button>

  <button type="button" class="tab" role="tab" [class.active]="active === 'wallet'" aria-label="Wallet"
    (click)="onWallet()">
    <ion-icon [name]="active === 'wallet' ? 'wallet' : 'wallet-outline'"></ion-icon>
    <span class="label">Wallet</span>
  </button>

  <button type="button" class="tab center" role="tab" [class.active]="active === 'elastos'" aria-label="Elastos"
    (click)="onElastos()">
    <div class="center-circle">
      <!-- Elastos logo (inlined from assets/components/titlebar/elastos.svg, tinted via currentColor) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="21.5" viewBox="0 0 24.452 20.189"
        fill="currentColor" aria-hidden="true">
        <path d="M3058.25 1682.818l6.113-3.529 6.113-3.551-6.113-3.529-6.113 3.529-6.113-3.529-6.113 3.529 6.113 3.551z"
          transform="translate(-3046.024 -1662.628)" />
        <path d="M3058.25 1563.609l6.113-3.529 6.113-3.551-6.113-3.529-6.113 3.529-6.113-3.529-6.113 3.529 6.113 3.551z"
          transform="translate(-3046.024 -1553)" />
      </svg>
    </div>
  </button>

  <button type="button" class="tab" role="tab" [class.active]="active === 'browser'" aria-label="dApps"
    (click)="onBrowser()">
    <ion-icon [name]="active === 'browser' ? 'apps' : 'apps-outline'"></ion-icon>
    <span class="label">dApps</span>
  </button>

  <button type="button" class="tab" role="tab" [class.active]="active === 'menu'" aria-label="Settings"
    (click)="onMenu()">
    <ion-icon [name]="active === 'menu' ? 'settings' : 'settings-outline'"></ion-icon>
    <span class="label">Settings</span>
  </button>
</nav>
