<div class="root ion-activatable ripple" [class.cancel]="mode == 'cancel'" [class.danger]="mode == 'danger'"
    [class.disabled]="disabled" (click)="onClicked()">
    <div *ngIf="!spinning" class="inner-content" [class.left-icon-container]="leftIcon"
        [class.top-icon-container]="topIcon" [class.small]="small">

        <!-- NOTE: We use inlineSVG (works only with SVG) for non remote pictures, so they can be inlined thus colorized with CSS current color -->

        <img [cache]="leftIcon" *ngIf="leftIcon && leftIconShouldBeCached()" class="icon left-icon" [class.roundedIcon]="roundedIcon"/>
        <div [inlineSVG]="leftIcon" *ngIf="leftIcon && !leftIconShouldBeCached()" class="icon left-icon" [class.roundedIcon]="roundedIcon"></div>

        <img [cache]="topIcon" *ngIf="topIcon && topIconShouldBeCached()" class="icon top-icon" [class.roundedIcon]="roundedIcon"/>
        <div [inlineSVG]="topIcon" *ngIf="topIcon && !topIconShouldBeCached()" class="icon top-icon" [class.roundedIcon]="roundedIcon"></div>

        <div class="title" [class.smaller]="topIcon" [class.uppercase]="uppercase">{{ title }}</div>
    </div>

    <!-- Trailing arrow disc for primary Continue/Create/Share CTAs (2026 design) -->
    <div *ngIf="arrow && !spinning && !disabled" class="arrow-disc" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h12.5M12 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </div>
    <ion-spinner *ngIf="spinning"></ion-spinner>

    <ion-ripple-effect *ngIf="!disabled"></ion-ripple-effect>
</div>
