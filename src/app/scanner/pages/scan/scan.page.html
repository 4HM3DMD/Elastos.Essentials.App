<ion-content no-scroll [ngClass]="{'transparentBody':isCameraShown}">
    <app-titlebar></app-titlebar>
            
    <!-- Camera ON: opaque #111111 page with a rounded transparent window onto the native feed -->
    <div *ngIf="isCameraShown; else cameraOff" class="scan-camera">
        <!-- Rounded cutout window; the huge box-shadow paints the rest of the page #111111 -->
        <div class="camera-window">
            <div class="scan-line"></div>
        </div>

        <!-- Torch toggle: #1E1E1E hairline circle, accent when active -->
        <button type="button" class="torch-toggle" [class.torch-on]="torchLightOn" (click)="toggleLight()">
            <ion-icon name="flashlight-outline"></ion-icon>
        </button>

        <!-- Instruction caption below the card -->
        <p class="scan-caption">{{ 'scanner.scan-instruction' | translate }}</p>

        <!-- Album pill: import a QR from the photo library -->
        <button type="button" class="album-pill" (click)="scanFromLibrary()">
            <ion-icon name="images-outline"></ion-icon>
            <span>{{ 'scanner.album' | translate }}</span>
        </button>
    </div>

    <!-- Camera OFF / permission denied: designed fallback state -->
    <ng-template #cameraOff>
        <div class="camera-denied" *ngIf="cameraDenied">
            <div class="camera-denied-icon">
                <ion-icon name="camera-outline"></ion-icon>
            </div>
            <h2 class="camera-denied-title">{{ 'scanner.camera-denied-title' | translate }}</h2>
            <p class="camera-denied-desc">{{ 'scanner.camera-denied-desc' | translate }}</p>
            <button type="button" class="enable-camera-btn" (click)="startScanningProcess()">
                {{ 'scanner.enable-camera' | translate }}
            </button>
        </div>
    </ng-template>
</ion-content>
