<ion-content>
  <div class="home">
    <!-- In-page header: this screen hides the titlebar and handles the top inset itself -->
    <div class="header">
      <button type="button" class="account" (click)="onIdentity()" aria-label="My identity">
        <img *ngIf="avatarDataUrl" class="avatar" [src]="avatarDataUrl" alt="" />
        <img *ngIf="!avatarDataUrl" class="avatar" src="assets/launcher/default/default-avatar.svg" alt="" />
        <span class="name">{{ identityName }}</span>
      </button>
      <div class="actions">
        <button type="button" class="icon-btn" aria-label="Notifications" (click)="onNotifications()">
          <ion-icon name="notifications-outline"></ion-icon>
          <span *ngIf="hasNewNotifications" class="dot"></span>
        </button>
        <button type="button" class="icon-btn" aria-label="Scan" (click)="onScan()">
          <ion-icon name="scan-outline"></ion-icon>
        </button>
        <button type="button" class="icon-btn" aria-label="Settings" (click)="onSettings()">
          <ion-icon name="settings-outline"></ion-icon>
        </button>
      </div>
    </div>

    <div *ngIf="networkBanner" class="network-banner">{{ networkBanner }}</div>

    <!-- Active wallet balance (fiat-first; native as the secondary line) -->
    <div *ngIf="balanceVm" class="balance-block">
      <ui-amount-display [size]="3" [value]="balanceVm.primary" [unit]="balanceVm.symbol" [fiat]="balanceVm.secondary"
        [hidden]="effectiveHide" [showToggle]="true" (toggleHidden)="toggleHideBalances()"></ui-amount-display>
    </div>

    <!-- Quick actions -->
    <ui-action-grid *ngIf="hasWallet()" [columns]="4" class="tiles">
      <ui-action-tile label="Send" (pressed)="onMainAction()">
        <ion-icon name="arrow-up-outline"></ion-icon>
      </ui-action-tile>
      <ui-action-tile label="Receive" (pressed)="onMainAction()">
        <ion-icon name="arrow-down-outline"></ion-icon>
      </ui-action-tile>
      <ui-action-tile label="Swap" (pressed)="onMainAction()">
        <ion-icon name="swap-horizontal-outline"></ion-icon>
      </ui-action-tile>
      <ui-action-tile label="Stake" (pressed)="onMainAction()">
        <ion-icon name="layers-outline"></ion-icon>
      </ui-action-tile>
    </ui-action-grid>

    <!-- Active wallet not available on the current network -->
    <div *ngIf="walletUnavailable" class="wallet-unavailable">
      <ui-empty-state [message]="'launcher.home-wallet-unavailable' | translate"
        [actionLabel]="'launcher.home-pillar-value' | translate" (action)="onValue()"></ui-empty-state>
    </div>

    <!-- Pillars -->
    <div class="pillars">
      <ui-token-row class="pillar value" icon="/assets/launcher/apps/app-icons/wallet.svg"
        [title]="identityName || ('launcher.home-pillar-value' | translate)"
        [sub]="'launcher.home-pillar-value-sub' | translate"
        [value]="totalFiatDisplay ? (effectiveHide ? mask : totalFiatDisplay) : null"
        [chevron]="true" (pressed)="onValue()"></ui-token-row>
      <ui-token-row class="pillar identity" icon="/assets/launcher/apps/app-icons/identity.svg"
        [title]="'launcher.app-identity' | translate"
        [sub]="didShort || ('launcher.app-identity-description' | translate)"
        [chevron]="true" (pressed)="onIdentity()"></ui-token-row>
      <ui-token-row class="pillar apps" icon="/assets/launcher/apps/app-icons/browser.svg"
        [title]="'launcher.home-pillar-apps' | translate" [sub]="'launcher.home-pillar-apps-sub' | translate"
        [chevron]="true" (pressed)="onApps()"></ui-token-row>
    </div>

    <!-- Tokens preview (top 3 by fiat value) -->
    <div *ngIf="tokenRows && tokenRows.length > 0" class="tokens">
      <div class="section-head">
        <h2>{{ 'launcher.home-tokens' | translate }}</h2>
        <button type="button" class="see-all" (click)="onValue()">{{ 'launcher.home-see-all' | translate }}</button>
      </div>
      <div class="card-group">
        <ui-token-row *ngFor="let row of tokenRows; trackBy: trackToken" [icon]="row.icon" [badge]="row.badge"
          [title]="row.title" [value]="effectiveHide ? mask : row.balance"
          [subValue]="row.fiat ? (effectiveHide ? mask : row.fiat) : null" (pressed)="onTokenRow(row)"></ui-token-row>
      </div>
    </div>
  </div>
</ion-content>
