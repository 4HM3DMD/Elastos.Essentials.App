<ion-content>
  <div class="home">
    <!-- In-page header: this screen hides the titlebar and handles the top inset itself -->
    <div class="header">
      <button type="button" class="account" (click)="onIdentity()" aria-label="My identity">
        <img *ngIf="avatarDataUrl" class="avatar" [src]="avatarDataUrl" alt="" />
        <span *ngIf="!avatarDataUrl" class="avatar avatar-initial">{{ (identityName || 'E').charAt(0) | uppercase }}</span>
        <span class="name">{{ identityName }}</span>
        <!-- Forward chevron: the pill navigates to the identity page. A down chevron would
             promise an account-switcher dropdown (the MetaMask pattern) that is not there;
             the switcher sheet itself is tracked in the super-wallet-patterns audit. -->
        <ion-icon class="chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>
      <div class="actions">
        <button type="button" class="icon-btn" aria-label="Notifications" (click)="onNotifications()">
          <ion-icon name="notifications-outline"></ion-icon>
          <span *ngIf="hasNewNotifications" class="dot"></span>
        </button>
        <button type="button" class="icon-btn" aria-label="Scan" (click)="onScan()">
          <ion-icon name="scan-outline"></ion-icon>
        </button>
        <!-- Active-chain selector: logo only, opens the network chooser. Settings lives on the tab bar. -->
        <button type="button" class="icon-btn chain" aria-label="Switch network" *ngIf="currentNetwork"
          (click)="onPickNetwork()">
          <img [src]="currentNetwork.logo" alt="" />
        </button>
      </div>
    </div>

    <div *ngIf="networkBanner" class="network-banner">{{ networkBanner }}</div>

    <!-- Active wallet balance (fiat-first; native as the secondary line) -->
    <div *ngIf="balanceVm" class="balance-block">
      <ui-amount-display [size]="3" [value]="balanceVm.primary" [unit]="balanceVm.symbol"
        [hidden]="effectiveHide" [showToggle]="true" (toggleHidden)="toggleHideBalances()"></ui-amount-display>
      <div *ngIf="pnlVm" class="pnl-line">
        <span class="pnl-label">{{ 'launcher.home-todays-pnl' | translate }}</span>
        <span class="pnl-value" [class.up]="pnlVm.tone === 'up'" [class.down]="pnlVm.tone === 'down'">{{ effectiveHide ? mask : pnlVm.text }}</span>
      </div>
    </div>

    <!-- Quick actions: real destinations, gated per network (mirrors the Value screen).
         Swap/Stake hide when the active network has no such flow instead of falling
         through to the token-detail page. -->
    <ui-action-grid *ngIf="hasWallet()" [columns]="4" class="tiles">
      <ui-action-tile label="Send" icon="assets/wallet/action/send.png" (pressed)="onSend()"></ui-action-tile>
      <ui-action-tile label="Receive" icon="assets/wallet/action/receive.png" (pressed)="onReceive()"></ui-action-tile>
      <ui-action-tile *ngIf="canSwap()" label="Swap" icon="assets/wallet/action/swap.png" (pressed)="onSwap()"></ui-action-tile>
      <ui-action-tile *ngIf="canStake()" label="Stake" icon="assets/wallet/action/stake.png" (pressed)="onStake()"></ui-action-tile>
    </ui-action-grid>

    <!-- Active wallet not available on the current network -->
    <div *ngIf="walletUnavailable" class="wallet-unavailable">
      <ui-empty-state [message]="'launcher.home-wallet-unavailable' | translate"
        [actionLabel]="'launcher.home-pillar-value' | translate" (action)="onValue()"></ui-empty-state>
    </div>

    <!-- Pillars -->
    <div class="pillars">
      <ui-token-row class="pillar value" icon="/assets/launcher/apps/app-icons/value-coin.svg"
        [title]="'launcher.home-pillar-value' | translate"
        [sub]="'launcher.home-pillar-value-sub' | translate"
        [value]="totalFiatDisplay ? (effectiveHide ? mask : totalFiatDisplay) : null"
        [chevron]="!totalFiatDisplay" (pressed)="onValue()"></ui-token-row>
      <ui-token-row class="pillar identity" icon="/assets/launcher/apps/app-icons/identity-badge.svg"
        [title]="'launcher.app-identity' | translate"
        [sub]="didShort || ('launcher.app-identity-description' | translate)"
        [chevron]="true" (pressed)="onIdentity()"></ui-token-row>
      <!-- TODO(SCR-050): show a live connected-dApps count once WalletConnect session
           counts are wired here. The count was hardcoded to 0 ("0 Connected"), which was
           false whenever sessions existed, so show a plain navigable chevron instead. -->
      <ui-token-row class="pillar apps" icon="/assets/launcher/apps/app-icons/apps-grid.svg"
        [title]="'launcher.home-pillar-apps' | translate" [sub]="'launcher.home-pillar-apps-sub' | translate"
        [chevron]="true" (pressed)="onApps()"></ui-token-row>
    </div>

    <!-- Tokens preview (top 3 by fiat value); header always shown while a wallet is active -->
    <div *ngIf="hasWallet()" class="tokens">
      <div class="section-head">
        <h2>{{ 'launcher.home-tokens' | translate }}</h2>
        <button *ngIf="tokenRows && tokenRows.length > 0" type="button" class="see-all" (click)="onValue()">{{ 'launcher.home-see-all' | translate }}</button>
      </div>
      <div *ngIf="tokenRows && tokenRows.length > 0" class="token-list">
        <ui-token-row *ngFor="let row of tokenRows; trackBy: trackToken" [icon]="row.icon" [badge]="row.badge"
          [title]="row.title" [sub]="effectiveHide ? mask : row.native"
          [value]="row.fiat ? (effectiveHide ? mask : row.fiat) : null"
          [subValue]="row.changePct" [subValueTone]="row.changeTone" (pressed)="onTokenRow(row)"></ui-token-row>
      </div>
      <div *ngIf="!tokenRows || tokenRows.length === 0" class="tokens-empty">
        {{ 'launcher.home-no-tokens' | translate }}
      </div>
    </div>
  </div>
</ion-content>
