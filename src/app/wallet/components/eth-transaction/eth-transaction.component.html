<ion-content>
  <!-- SCR-009 / SCR-010: 2026 publication sheet — grabber + ui-sheet-header, orange progress track.
       Dead [class.dark-process-container] removed. -->
  <div class="publication-sheet">
    <ui-sheet-header
      [title]="publishing
        ? ('wallet.eth-sending-transaction' | translate)
        : (publicationSuccessful
            ? ('wallet.tx-success' | translate)
            : (publicationStatus == 'unpacked'
                ? ('wallet.eth-transaction-pending' | translate)
                : ('wallet.eth-transaction-fail' | translate)))">
    </ui-sheet-header>

    <!-- SCR-010: slim orange-gradient progress track + clock + wait caption. -->
    <div class="progress-block" *ngIf="publishing">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-caption">
        <ion-icon name="time-outline"></ion-icon>
        <span>{{ 'wallet.eth-transaction-wait' | translate }}</span>
      </div>
    </div>

    <!-- Completed state on the same screen (filled bar + success caption). -->
    <div class="progress-block" *ngIf="publicationSuccessful">
      <div class="progress-track">
        <div class="progress-fill done"></div>
      </div>
      <div class="progress-caption success">
        <ion-icon name="checkmark-circle"></ion-icon>
        <span>{{ 'wallet.tx-success' | translate }}</span>
      </div>
    </div>

    <!-- Pending / error branch: speed-up affordance on the shared sheet surface. -->
    <div class="speedup-block" *ngIf="publicationFailed">
      <p class="speedup-prompt">{{ 'wallet.eth-transaction-speedup-prompt' | translate }}</p>

      <div class="gas-fields">
        <div class="gas-field">
          <div class="gas-label">{{ 'wallet.eth-gasprice' | translate }}</div>
          <ion-input autosize clearInput name="gasPrice" ngDefaultControl [(ngModel)]="gasPrice" mode="ios"></ion-input>
        </div>
        <div class="gas-field">
          <div class="gas-label">{{ 'wallet.eth-gaslimit' | translate }}</div>
          <ion-input autosize clearInput name="gasLimit" ngDefaultControl [(ngModel)]="gasLimit" mode="ios"></ion-input>
        </div>
      </div>

      <div class="btn-row">
        <ebutton mode="cancel" (clicked)="cancel()" [title]="'common.close' | translate"></ebutton>
        <ebutton (clicked)="speedup()" [title]="'wallet.eth-transaction-speedup' | translate"></ebutton>
      </div>
    </div>
  </div>
</ion-content>
