<ion-content>
  <div class="network-sheet">
    <!-- SCR-083: grab-handle pill signals the sheet is swipe-dismissable. -->
    <div class="grab-handle"></div>

    <!-- SCR-083: single left-aligned title; subtitle and settings gear removed. -->
    <div class="sheet-header">
      <div class="titles">
        <h1>{{ 'wallet.select-network-title' | translate }}</h1>
      </div>
    </div>

    <!-- SCR-084: search only appears once the list is long enough to warrant filtering. -->
    <div class="search-row" *ngIf="networksToShowInList.length > 6">
      <ion-icon name="search-outline"></ion-icon>
      <input type="text" [(ngModel)]="searchInput" (ngModelChange)="applyNetworkFilter()"
        [placeholder]="'wallet.search-network' | translate" autocapitalize="off" autocomplete="off" spellcheck="false" />
    </div>

    <div class="network-list">
      <button type="button" *ngFor="let network of displayedNetworks; trackBy: trackByKey" class="network-row ion-activatable"
        [class.selected]="currentNetwork && network.key === currentNetwork.key" (click)="selectNetwork(network)">
        <img class="logo" [src]="network.logo" alt="" />
        <!-- SCR-087: appends the token standard (ERC20/BEP20/TRC20) when picking a network for a token. -->
        <span class="name">{{ getNetworkDisplayName(network) }}</span>
        <span *ngIf="isMainChain(network)" class="tools-chip">{{ 'wallet.network-tools-chip' | translate }}</span>
        <ion-icon class="check" name="checkmark"></ion-icon>
        <ion-ripple-effect></ion-ripple-effect>
      </button>

      <div *ngIf="displayedNetworks.length === 0" class="no-results">
        {{ 'wallet.network-no-results' | translate }}
      </div>
    </div>
  </div>
</ion-content>

<!-- SCR-084: Cancel footer removed; the sheet dismisses via backdrop tap / swipe-down. -->
