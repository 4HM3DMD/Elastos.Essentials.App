<ion-content class="lightmode" [class.darkmode]="theme.darkMode">
    <app-titlebar></app-titlebar>

    <ion-content #tokenContent class="intersection-container">
        <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
            <ion-refresher-content pullingIcon="arrow-down" refreshingSpinner="crescent">
            </ion-refresher-content>
        </ion-refresher>

        <!-- Can't use ngIf here, otherwise fetchmoretrigger will be invalid -->
        <ion-grid class="container">
            <!-- Balance card - the classic Essentials anchor, in the 2026 skin: identity
                 row, a Balance label over a TAPPABLE amount (native <-> fiat, as the old
                 app had), the staked line, and the canonical Transfer / Send / Receive
                 row inside the card. The washed network mark keeps the old card-art
                 feeling without a loud gradient. -->
            <div *ngIf="networkWallet" class="balance-card">
                <img class="card-art" [src]="networkWallet.network.logo" alt="" />

                <div class="card-identity">
                    <img class="card-coin" [src]="subWallet.getMainIcon() || networkWallet.network.logo" />
                    <div class="card-names">
                        <span class="card-token">{{ subWallet.getDisplayTokenName() }}</span>
                        <span class="card-network">{{ networkWallet.network.getEffectiveName() }}</span>
                    </div>
                </div>

                <h3 class="card-balance-label">{{ 'wallet.coin-balance' | translate }}</h3>
                <button type="button" class="card-balance" (click)="toggleBalanceCurrency()">
                    <ui-amount-display [size]="3" [value]="coinDisplayValue" [unit]="coinDisplayUnit"></ui-amount-display>
                    <span *ngIf="coinDisplaySub" class="card-sub">≈ {{ coinDisplaySub }}</span>
                </button>

                <div *ngIf="stakedBalance" class="staked-line">
                    <span class="staked-label">{{ getStakeTitle() | translate }}</span>
                    <span class="staked-value">{{ getStakedBalanceInNative() }} {{ networkWallet.getDisplayTokenName() }}</span>
                </div>

                <div class="card-actions">
                    <button *ngIf="coinCanBeTransferred()" type="button" class="card-action" (click)="transferFunds()">
                        <span class="card-action-disc"><img src="assets/wallet/action/swap.png" alt="" /></span>
                        <span class="card-action-label">{{ (chainIsELA() ? 'wallet.coin-action-recharge' : 'wallet.coin-action-withdraw') | translate }}</span>
                    </button>
                    <button *ngIf="coinCanBeSent()" type="button" class="card-action" (click)="sendFunds()">
                        <span class="card-action-disc"><img src="assets/wallet/action/send.png" alt="" /></span>
                        <span class="card-action-label">{{ 'wallet.coin-action-send' | translate }}</span>
                    </button>
                    <button type="button" class="card-action" (click)="receiveFunds()">
                        <span class="card-action-disc"><img src="assets/wallet/action/receive.png" alt="" /></span>
                        <span class="card-action-label">{{ 'wallet.coin-action-receive' | translate }}</span>
                    </button>
                </div>
            </div>

            <!-- History section header. No view-all chevron until a dedicated
                 cross-token History page exists (SCR-154, deferred) - a chevron with
                 no handler implied an action that did nothing. -->
            <div class="history-header">
                <h1 class="history-title">{{ 'wallet.coin-history' | translate }}</h1>
            </div>

            <!-- Source tabs (Transactions / Internal / Recharge) — only when more than one set exists -->
            <ui-chip-row *ngIf="txTabs.length > 1" class="tx-source-tabs" [chips]="txTabs" [active]="activeTxTab"
                (activeChange)="onTxTabChange($event)"></ui-chip-row>

            <!-- Transaction-type filter (All / Sent / Received / Staked) — SYS-008.
                 Ghost variant: the filter is a quiet control, it must not compete with
                 the section header above or the rows below. -->
            <ui-chip-row class="tx-type-filter" variant="ghost" [chips]="txTypeChips" [active]="txTypeFilter"
                (activeChange)="onTxTypeFilterChange($event)"></ui-chip-row>

            <!-- Loading skeleton -->
            <ui-skeleton *ngIf="!transactionsLoaded" kind="row" [rows]="5"></ui-skeleton>

            <ng-container *ngIf="transactionsLoaded">
                <!-- Offline (offchain) transactions -->
                <ui-token-row *ngFor="let offlineTx of offlineTransactions"
                    icon="/assets/wallet/tx/transfer.svg" [iconTone]="'neutral'" [iconGlyphTone]="'muted'"
                    [title]="getOfflineTransactionTitle(offlineTx)"
                    [sub]="getOfflineTransactionDate(offlineTx)"
                    (pressed)="onOfflineTransactionItem(offlineTx)"></ui-token-row>

                <!-- Onchain transactions grouped by day (Today / Earlier), filtered by type.
                     Right column is a single signed native amount, no per-row fiat (SYS-007/008/031). -->
                <ng-container *ngFor="let group of txGroups; trackBy: trackByGroupKey">
                    <h2 class="tx-group-header">{{ group.label }}</h2>
                    <!-- SYS-027: charcoal disc + directional glyph tint (up=received, down=sent) -->
                    <ui-token-row *ngFor="let item of group.items; trackBy: trackByTxId"
                        [icon]="getPayStatusIcon(item)" [iconTone]="'neutral'"
                        [iconGlyphTone]="item.type === 1 ? 'up' : (item.type === 2 ? 'down' : 'muted')"
                        [title]="getTransactionTitle(item)" [sub]="item.datetime"
                        [value]="(item.symbol || '') + uiService.getFixedBalance(item.amount)"
                        [valueTone]="item.type === 1 ? 'up' : (item.type === 2 ? 'down' : 'muted')"
                        (pressed)="onItem(item)"></ui-token-row>
                </ng-container>

                <!-- Empty transactions list. A filtered-out list says so instead of the
                     generic "No transactions", which reads as broken when rows exist. -->
                <ui-empty-state *ngIf="txGroups.length === 0 && offlineTransactions.length === 0"
                    icon="receipt-outline"
                    [message]="(txTypeFilter === 'all' ? 'wallet.coin-no-transactions' : 'wallet.coin-no-filtered-transactions') | translate"></ui-empty-state>
            </ng-container>

            <!-- Used to detect when user reaches the screen bottom to load more transactions -->
            <div #fetchmoretrigger></div>
            <ion-row class="list-title-row" *ngIf="canFetchMore && shouldShowLoadingSpinner">
                <ion-col class="spinner-col" size="12">
                    <ion-spinner id="fetching-more-spinner" name="dots"></ion-spinner>
                </ion-col>
            </ion-row>
        </ion-grid>
    </ion-content>
</ion-content>
