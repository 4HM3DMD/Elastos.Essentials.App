<ion-content class="lightmode" [class.darkmode]="theme.darkMode">
    <app-titlebar></app-titlebar>

    <ion-content ngxDetectHideOnScroll scrollEvents class="intersection-container">
        <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
            <ion-refresher-content pullingIcon="arrow-down" refreshingSpinner="crescent">
            </ion-refresher-content>
        </ion-refresher>

        <!-- Can't use ngIf here, otherwise fetchmoretrigger will be invalid -->
        <ion-grid class="container">
            <!-- Centered token hero (SCR-094/099/105): coin disc, "Est. total value" caption,
                 large native amount + grey unit, then fiat + %change on one line. No card. -->
            <div *ngIf="networkWallet" class="token-hero">
                <img class="token-hero-disc" [src]="subWallet.getMainIcon() || networkWallet.network.logo" />
                <h3 class="token-hero-caption">{{ 'wallet.coin-est-total-value' | translate }}</h3>
                <ui-amount-display [size]="3" [value]="coinDisplayValue" [unit]="coinDisplayUnit"></ui-amount-display>
                <div class="token-hero-sub">
                    <span *ngIf="coinDisplayFiat" class="hero-fiat">{{ coinDisplayFiat }}</span>
                    <span *ngIf="coinPercentChangeVm" class="hero-change" [class.up]="coinPercentChangeVm.tone === 'up'"
                        [class.down]="coinPercentChangeVm.tone === 'down'">{{ coinPercentChangeVm.text }}</span>
                </div>
                <div *ngIf="stakedBalance" class="staked-line">
                    <span class="staked-label">{{ getStakeTitle() | translate }}</span>
                    <span class="staked-value">{{ getStakedBalanceInNative() }} {{ networkWallet.getDisplayTokenName() }}</span>
                </div>
            </div>

            <!-- Price chart from local history — hidden until enough points exist.
                 Full-bleed to the screen edges and taller (SCR-102). -->
            <div *ngIf="priceSeriesVm" class="price-chart">
                <div class="chart-canvas">
                    <!-- SCR-101: burnt-orange accent chart with gradient fill + end dot -->
                    <ui-sparkline [points]="priceSeriesVm" [height]="200" tone="accent"></ui-sparkline>
                </div>
                <!-- SCR-103: ghost range selector (text-only chips, dark active disc) -->
                <ui-chip-row variant="ghost" [chips]="rangeChips" [active]="chartRange"
                    (activeChange)="setChartRange($event)"></ui-chip-row>
            </div>

            <!-- History section header with a view-all chevron (SCR-104) -->
            <div class="history-header">
                <h1 class="history-title">{{ 'wallet.coin-history' | translate }}</h1>
                <ion-icon class="history-chevron" name="chevron-forward"></ion-icon>
            </div>

            <!-- Source tabs (Transactions / Internal / Recharge) — only when more than one set exists -->
            <ui-chip-row *ngIf="txTabs.length > 1" class="tx-source-tabs" [chips]="txTabs" [active]="activeTxTab"
                (activeChange)="onTxTabChange($event)"></ui-chip-row>

            <!-- Transaction-type filter chips (All / Sent / Received / Swap / Staked) — SYS-008 -->
            <ui-chip-row class="tx-type-filter" [chips]="txTypeChips" [active]="txTypeFilter"
                (activeChange)="onTxTypeFilterChange($event)"></ui-chip-row>

            <!-- Loading skeleton -->
            <ui-skeleton *ngIf="!transactionsLoaded" kind="row" [rows]="5"></ui-skeleton>

            <ng-container *ngIf="transactionsLoaded">
                <!-- Offline (offchain) transactions -->
                <ui-token-row *ngFor="let offlineTx of offlineTransactions"
                    icon="/assets/wallet/tx/transfer.svg" [iconTone]="'neutral'" [iconGlyphTone]="'muted'"
                    [title]="getOfflineTransactionTitle(offlineTx)"
                    [sub]="getOfflineTransactionDate(offlineTx)"
                    (pressed)="onOfflineTransactionItem(offlineTx)"></ui-token-row>

                <!-- Onchain transactions grouped by day (Today / Earlier), filtered by type.
                     Right column is a single signed native amount, no per-row fiat (SYS-007/008/031). -->
                <ng-container *ngFor="let group of txGroups; trackBy: trackByGroupKey">
                    <h2 class="tx-group-header">{{ group.label }}</h2>
                    <!-- SYS-027: charcoal disc + directional glyph tint (up=received, down=sent) -->
                    <ui-token-row *ngFor="let item of group.items; trackBy: trackByTxId"
                        [icon]="getPayStatusIcon(item)" [iconTone]="'neutral'"
                        [iconGlyphTone]="item.type === 1 ? 'up' : (item.type === 2 ? 'down' : 'muted')"
                        [title]="getTransactionTitle(item)" [sub]="item.datetime"
                        [value]="(item.symbol || '') + uiService.getFixedBalance(item.amount)"
                        [valueTone]="item.type === 1 ? 'up' : (item.type === 2 ? 'down' : 'muted')"
                        (pressed)="onItem(item)"></ui-token-row>
                </ng-container>

                <!-- Empty transactions list -->
                <ui-empty-state *ngIf="txGroups.length === 0 && offlineTransactions.length === 0"
                    icon="receipt-outline" [message]="'wallet.coin-no-transactions' | translate"></ui-empty-state>
            </ng-container>

            <!-- Used to detect when user reaches the screen bottom to load more transactions -->
            <div #fetchmoretrigger></div>
            <ion-row class="list-title-row" *ngIf="canFetchMore && shouldShowLoadingSpinner">
                <ion-col class="spinner-col" size="12">
                    <ion-spinner id="fetching-more-spinner" name="dots"></ion-spinner>
                </ion-col>
            </ion-row>
        </ion-grid>
    </ion-content>

    <div class="footer" ngxHideOnScroll *ngIf="subWallet">
        <!-- Overflow actions (Stake / Transfer) revealed above the pill trio (SCR-096) -->
        <div *ngIf="moreActionsOpen" class="more-actions-menu">
            <button *ngIf="canStakeELA() || canStakeTRX()" type="button" class="menu-item"
                (click)="onStakeAction(); toggleMoreActions()">Stake</button>
            <!-- Transfer = cross-chain move, only on the Elastos mainchain and its sidechains -->
            <button *ngIf="coinCanBeTransferred()" type="button" class="menu-item"
                (click)="transferFunds(); toggleMoreActions()">Transfer</button>
        </div>
        <div class="action-pills">
            <button *ngIf="coinCanBeSent()" type="button" class="pill pill-dark" (click)="sendFunds()">Send</button>
            <button type="button" class="pill pill-accent" (click)="receiveFunds()">Receive</button>
            <button *ngIf="hasMoreActions()" type="button" class="pill-more" (click)="toggleMoreActions()"
                aria-label="More actions">
                <ion-icon name="ellipsis-horizontal"></ion-icon>
            </button>
        </div>
    </div>
</ion-content>
