<ion-content>
  <app-titlebar></app-titlebar>

  <div class="receive">
    <!-- QR card -->
    <!-- SCR-068: #qrCard ref lets saveImage() grab the rendered QR canvas for PNG export. -->
    <div *ngIf="qrcode" #qrCard class="qr-card">
      <!-- Standard dark-on-light QR so any scanner reads it (was inverted). The dark
           .qr-card frames the white code; colorLight provides the light quiet-zone. -->
      <qrcode class="qrcode" [qrdata]="qrcode" [width]="200" colorDark="#000000" colorLight="#FFFFFF" [margin]="2"></qrcode>
    </div>

    <!-- Network -->
    <div class="section">
      <p class="section-label">
        {{ 'wallet.coin-receive-network-label' | translate }}
        <ion-icon class="info-glyph" name="information-circle-outline"></ion-icon>
      </p>
      <div class="network-row">
        <span class="network-disc">
          <img *ngIf="networkLogo" class="network-logo" [src]="networkLogo" alt="" />
        </span>
        <span class="network-name">{{ networkName }}</span>
      </div>
    </div>

    <!-- Address type chips (only when more than one receiving address type exists) -->
    <div *ngIf="addressChips.length > 1" class="type-chips">
      <ui-chip-row [chips]="addressChips" [active]="activeAddressType"
        (activeChange)="onAddressTypeChange($event)"></ui-chip-row>
    </div>

    <!-- Address -->
    <div class="section">
      <p class="section-label">{{ 'wallet.coin-receive-address-label' | translate }}</p>
      <div class="address-row">
        <span class="address" (click)="copyAddress()">{{ shortAddress }}</span>
        <button type="button" class="copy-disc" aria-label="Copy address" (click)="copyAddress()">
          <ion-icon name="copy-outline"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Push the caption + actions to the bottom of the viewport -->
    <div class="flex-spacer"></div>

    <!-- Cross-network safety warning -->
    <p class="warning">
      {{ 'wallet.coin-receive-warning' | translate:{ coin: tokenName, network: networkName } }}
    </p>

    <button *ngIf="!isSingleAddress" type="button" class="address-list" (click)="showAddressList()">
      {{ 'wallet.coin-receive-address-list' | translate }}
    </button>

    <!-- Bottom actions -->
    <div class="actions">
      <!-- SCR-068: bottom-left action saves the QR as an image; Copy remains on the address row above. -->
      <button type="button" class="action secondary" (click)="saveImage()">
        <ion-icon name="image-outline"></ion-icon>
        <span>{{ 'wallet.coin-receive-save-image' | translate }}</span>
      </button>
      <button type="button" class="action primary" (click)="shareAddress()">
        <ion-icon name="share-outline"></ion-icon>
        <span>{{ 'wallet.coin-receive-share' | translate }}</span>
      </button>
    </div>
  </div>
</ion-content>
