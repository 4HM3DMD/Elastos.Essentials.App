<ion-content>
  <app-titlebar></app-titlebar>

  <div class="access-sheet">
    <ui-sheet-header [title]="title"
      [origin]="requestDapp ? { icon: (exportMnemonic ? '/assets/shared/curcol-icons/warning.svg' : '/assets/wallet/settings/curcol-wallet.svg'), name: requestDapp } : null">
    </ui-sheet-header>

    <!-- Information request -->
    <div *ngIf="!exportMnemonic">
      <p class="reason" *ngIf="showReason">{{ 'wallet.access-reason' | translate }}: {{ requestItems[0].reason }}</p>
      <p class="reason" *ngIf="!showReason">{{ 'wallet.access-request-for-info' | translate }}</p>
      <p class="sub-reason">{{ 'wallet.access-data-access' | translate }}</p>

      <div class="card-group">
        <ui-kv-row *ngFor="let item of requestItems" [label]="getClaimTitle(item.name) | translate"
          [value]="item.name === 'elaamount' ? (item.value + ' ELA') : item.value"></ui-kv-row>
      </div>
    </div>

    <!-- Mnemonic export warning -->
    <div *ngIf="exportMnemonic" class="warning-block">
      <p>{{ 'wallet.text-share-mnemonic-warning' | translate }}</p>
      <p *ngIf="showReason">{{ 'wallet.access-reason' | translate }}: {{ requestItems[0].reason }}</p>
    </div>
  </div>

  <div class="sheet-footer">
    <ebutton class="btn cancel" mode="cancel" (clicked)="cancelOperation()"
      [title]="'common.cancel' | translate"></ebutton>
    <ebutton class="btn confirm" (clicked)="onShare()"
      [title]="'common.confirm' | translate"></ebutton>
  </div>
</ion-content>
